name: Build iOS IPA (No Codesign)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate iOS project
        run: flutter create .
      - name: Install dependencies
        run: flutter pub get
      - name: Disable Code Signing in Xcode
        run: |
          # Dùng Ruby (có sẵn trên macOS runner) để sửa trực tiếp file project.pbxproj 
          # Đổi ProvisioningStyle sang Manual và xóa các setting liên quan code signing
          ruby -e "
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
            end
          end
          if project.root_object.attributes['TargetAttributes']
            project.root_object.attributes['TargetAttributes'].each do |target, attributes|
              attributes['ProvisioningStyle'] = 'Manual'
            end
          end
          project.save
          "
          
          # Tắt Code Signing thông qua .xcconfig cho build Release
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
          
          # Sửa Podfile (nếu có)
          if [ -f "ios/Podfile" ]; then
            echo "post_install do |installer|" >> ios/Podfile
            echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
            echo "    target.build_configurations.each do |config|" >> ios/Podfile
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> ios/Podfile
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> ios/Podfile
            echo "      config.build_settings['CODE_SIGN_IDENTITY'] = '-'" >> ios/Podfile
            echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'" >> ios/Podfile
            echo "    end" >> ios/Podfile
            echo "  end" >> ios/Podfile
            echo "end" >> ios/Podfile
          fi
      - name: Build iOS App
        run: flutter build ios --release --no-codesign
      - name: Package to IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/iphoneos/app.ipa
