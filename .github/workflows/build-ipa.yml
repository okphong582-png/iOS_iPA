name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (no signing)
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/ThreeOneOSFive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty

      - name: Package IPA (unsigned)
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/ThreeOneOSFive.xcarchive/Products/Applications/3105.app" \
                "$RUNNER_TEMP/Payload/3105.app"
          cd $RUNNER_TEMP
          zip -qr MeoMeo.ipa Payload/
          echo "IPA created at $RUNNER_TEMP/MeoMeo.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoMeo-IPA
          path: ${{ runner.temp }}/MeoMeo.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MeoMeo Build #${{ github.run_number }}"
          body: |
            🐾 **MeoMeo — Free Fire VIP Mod Launcher**
            
            Build tự động từ commit: `${{ github.sha }}`
            
            > ⚠️ IPA chưa ký — cần ký lại bằng AltStore / SideStore / TrollStore trước khi cài.
          files: ${{ runner.temp }}/MeoMeo.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
