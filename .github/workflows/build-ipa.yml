name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List targets and schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj 2>&1 || true

      - name: Build app (no signing)
        run: |
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            2>&1

      - name: Find built .app
        run: |
          echo "=== Searching for .app ==="
          find "$RUNNER_TEMP/DerivedData" -name "*.app" -not -path "*/iphoneos-simulator/*" 2>/dev/null | head -20

      - name: Package IPA (unsigned)
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" 2>/dev/null | grep -v simulator | head -1)
          fi
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr MeoMeo.ipa Payload/
          echo "IPA size: $(du -sh MeoMeo.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoMeo-IPA
          path: ${{ runner.temp }}/MeoMeo.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MeoMeo Build #${{ github.run_number }}"
          body: |
            🐾 **MeoMeo — Free Fire VIP Mod Launcher**
            
            Build từ commit: `${{ github.sha }}`
            
            > ⚠️ IPA chưa ký — cần ký lại bằng AltStore / SideStore / TrollStore trước khi cài.
          files: ${{ runner.temp }}/MeoMeo.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
